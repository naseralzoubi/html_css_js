<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breaking Bad Theme</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Breaking Bad Theme</h1>
        <div class="video-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/F1HNuAE9WdU" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="content">
            <h2 class="subtitle">Breaking Bad</h2>
            <p class="description">Experience the iconic theme song from one of television's greatest shows.</p>
            <div class="chemical-element" id="animated-element">
                <div class="symbol">Br</div>
                <div class="number">35</div>
                <div class="name">Bromine</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
